services:
  app:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - PORT=4000
      - NODE_ENV=production
      - KUMAIL_URL=http://kumux-mail:3010
      - PERSONA_SERVICE_URL=http://aff-personal:3000
    volumes:
      - ./data:/app/data
    depends_on:
      - kumux-mail
      - aff-personal
    restart: unless-stopped

  kumux-mail:
    image: ghcr.io/mboxjem/kumux-mail:latest
    ports:
      - "3010:3010"
    volumes:
      - ./kumux-mail/kumux-mail.toml:/config/kumux-mail.toml:ro
    environment:
      - KUMUX_CONFIG=/config/kumux-mail.toml
      - KUMUX__SERVER__BIND_ADDR=0.0.0.0:3010
      - KUMUX__AUTH__API_KEYS=${KUMAIL_API_KEY:?KUMAIL_API_KEY must be set}
      - RUST_LOG=${RUST_LOG:-info}
    restart: unless-stopped

  aff-personal:
    image: ghcr.io/abcrd54/personal-aff-v2:latest
    ports:
      - "3000:3000"
    environment:
      - API_KEY=${PERSONA_SERVICE_API_KEY:?PERSONA_SERVICE_API_KEY must be set}
      - LLM_PROVIDER=${PERSONA_LLM_PROVIDER:-tokenrouter}
      - LLM_API_KEY=${PERSONA_LLM_API_KEY:-}
      - LLM_BASE_URL=${PERSONA_LLM_BASE_URL:-https://api.tokenrouter.com/v1}
      - LLM_MODEL=${PERSONA_LLM_MODEL:-deepseek/deepseek-v4-pro}
    restart: unless-stopped
